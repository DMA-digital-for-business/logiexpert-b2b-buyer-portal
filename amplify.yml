version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Usa Node.js 22.16
        - nvm install 22.16.0
        - nvm use 22.16.0

        # Verifica le Amplify env vars richieste
        - test -n "$VITE_B2B_URL"
        - test -n "$VITE_LOCAL_APP_CLIENT_ID"
        - test -n "$VITE_IS_LOCAL_ENVIRONMENT"
        - test -n "$VITE_ASSETS_ABSOLUTE_PATH"
        - test -n "$VITE_DISABLE_BUILD_HASH"

        # Crea il file .env.production dalle Amplify env vars
        - |
          cat > apps/storefront/.env.production << EOF
          VITE_B2B_URL=${VITE_B2B_URL}
          VITE_LOCAL_APP_CLIENT_ID=${VITE_LOCAL_APP_CLIENT_ID}
          VITE_IS_LOCAL_ENVIRONMENT=${VITE_IS_LOCAL_ENVIRONMENT}
          VITE_ASSETS_ABSOLUTE_PATH=${VITE_ASSETS_ABSOLUTE_PATH}
          VITE_DISABLE_BUILD_HASH=${VITE_DISABLE_BUILD_HASH}
          EOF

        # Installa le dipendenze
        - yarn install --frozen-lockfile

    build:
      commands:
        - yarn build

  artifacts:
    baseDirectory: apps/storefront/dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .yarn/cache/**/*
